opy b{font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.alert-copy small{color:var(--sub);font-size:10px}.alert-qty{color:var(--red);font-weight:700;font-size:11px}.section-card{margin-top:16px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;white-space:nowrap}.table th{text-align:left;color:#929d96;font-size:10px;letter-spacing:.35px;text-transform:uppercase;font-weight:600;padding:11px 16px;border-bottom:1px solid var(--line)}.table td{padding:12px 16px;border-bottom:1px solid #f0f2ef;font-size:11px;color:#56635b}.table tr:last-child td{border:0}.product-cell{display:flex;align-items:center;gap:10px;color:var(--ink);font-weight:600}.product-thumb{width:34px;height:34px;border-radius:10px;background:#f2f4ee;display:grid;place-items:center;font-size:18px}.product-cell small{display:block;color:#9aa39d;font-size:10px;font-weight:400;margin-top:3px}.badge{display:inline-flex;align-items:center;border-radius:20px;padding:4px 8px;font-size:10px;font-weight:600;background:#eaf5ed;color:#3f855f}.badge.low{background:#fff1e6;color:#c87d38}.badge.out{background:#ffefed;color:#c6534f}.badge.neutral{background:#f0f2ef;color:#7d8980}.searchbox{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:9px 11px;min-width:230px;color:#99a39c}.searchbox input{border:0;outline:0;min-width:0;width:100%;font-size:12px;color:var(--ink)}.searchbox:focus-within{border-color:#93b4a1;box-shadow:0 0 0 3px #25765b10}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.toolbar select,.field select{border:1px solid var(--line);border-radius:9px;background:white;padding:9px 11px;color:#536158;font-size:11px}.table-tools{padding:13px 15px;display:flex;justify-content:space-between;align-items:center;gap:10px}.location{font-size:11px}.location b{color:#3f5146}.table-actions{display:flex;gap:5px}.text-btn{border:0;background:none;color:var(--green);font-size:11px;font-weight:700;padding:5px}.empty{padding:34px;text-align:center;color:var(--sub);font-size:12px}.notice{border:1px solid #f0e1c5;background:#fffaf0;padding:12px 14px;border-radius:10px;color:#816b43;font-size:11px;margin-bottom:14px}.notice b{color:#69542e}.search-insights{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.chip{padding:6px 9px;border:1px solid var(--line);border-radius:20px;color:#637168;font-size:10px;background:#fff;cursor:pointer}.chip:hover{border-color:#a3c1ae;color:var(--green)}.overlay{position:fixed;inset:0;background:#18251f66;z-index:10;display:grid;place-items:center;padding:18px}.modal{width:min(560px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:16px;padding:22px;box-shadow:0 25px 80px #1115}.modal.wide{width:min(760px,100%)}.modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}.modal-head h2{font:700 18px Manrope;margin:0;letter-spacing:-.4px}.modal-head p{font-size:11px;color:var(--sub);margin:5px 0 0}.close{border:0;background:#f2f4f1;border-radius:8px;width:30px;height:30px;color:#657168}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:10px;color:#718077;font-weight:700}.field input,.field select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;outline:0;font-size:12px;color:var(--ink);background:#fff}.field input:focus,.field select:focus{border-color:#8fb29b}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:19px}.segmented{display:flex;gap:8px;margin-bottom:15px}.segmented button{flex:1;padding:10px;border:1px solid var(--line);border-radius:9px;background:white;color:#718078;font-weight:600;font-size:12px}.segmented button.selected{background:var(--green2);border-color:#d6e9dc;color:var(--green)}.toast{position:fixed;right:22px;bottom:22px;background:#24382e;color:#fff;padding:13px 17px;border-radius:11px;box-shadow:0 8px 24px #0002;font-size:12px;z-index:30;animation:up .2s ease}.toast.error{background:#a83f3b}@keyframes up{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.settings-card{padding:18px}.settings-card h3{font:700 13px Manrope;margin:0 0 5px}.settings-card>p{font-size:11px;color:var(--sub);margin:0 0 15px}.quick-actions{display:flex;gap:8px;flex-wrap:wrap}.mobile-head{display:none}.checkout-total{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:14px;margin-top:14px;font-weight:700}.invoice{padding:20px;background:#fafbf9;border:1px dashed #d8dfd8;border-radius:10px;margin-top:14px}.invoice h3{margin:0 0 5px}.invoice p{font-size:11px;color:var(--sub);margin:4px 0}.hidden{display:none!important}

<body><div id="app"></div><div id="modal-root"></div><div id="toast-root"></div>
<script src="./ai-config.js"></script>
<script>
(()=>{'use strict';
const KEY='stockroom-data-v1';
const initial={shop:{name:'Fern & Field',currency:'₹',threshold:8,sections:['Shop floor','Back room','Cold storage'],categories:['Pantry','Personal care','Wellness','Household']},products:[
{id:'p1',name:'Wildflower Honey',sku:'PAN-1042',barcode:'890123450001',category:'Pantry',section:'Shop floor',row:'A',column:'02',rack:'R-01',qty:24,min:8,price:285,cost:170,unit:'jar',dosage:'',expiry:'2027-05-18',icon:'🍯'},
{id:'p2',name:'Daily Vitamin D3',sku:'WEL-2081',barcode:'890123450002',category:'Wellness',section:'Shop floor',row:'B',column:'01',rack:'R-03',qty:6,min:8,price:349,cost:190,unit:'bottle',dosage:'1000 IU',expiry:'2026-12-20',icon:'🧴'},
{id:'p3',name:'Oat Milk, Barista',sku:'PAN-1088',barcode:'890123450003',category:'Pantry',section:'Cold storage',row:'C',column:'04',rack:'R-07',qty:3,min:8,price:145,cost:87,unit:'carton',dosage:'',expiry:'2026-11-25',icon:'🥛'},
{id:'p4',name:'Lavender Hand Cream',sku:'CARE-3012',barcode:'890123450004',category:'Personal care',section:'Shop floor',row:'D',column:'02',rack:'R-10',qty:18,min:6,price:220,cost:104,unit:'tube',dosage:'',expiry:'2028-03-01',icon:'🪻'},
{id:'p5',name:'Ceramic Travel Mug',sku:'HOME-4406',barcode:'890123450005',category:'Household',section:'Back room',row:'E',column:'01',rack:'R-12',qty:12,min:4,price:590,cost:310,unit:'piece',dosage:'',expiry:'',icon:'☕'},
{id:'p6',name:'Herbal Sleep Tea',sku:'PAN-1196',barcode:'890123450006',category:'Pantry',section:'Shop floor',row:'A',column:'05',rack:'R-02',qty:0,min:8,price:195,cost:98,unit:'box',dosage:'',expiry:'2027-01-15',icon:'🍵'}],sales:[],activity:[],searches:[],cart:[],view:'dashboard'};
let state;try{state=JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch{state=structuredClone(initial)};state={...structuredClone(initial),...state,shop:{...initial.shop,...state.shop}};if(window.STOCKROOM_AI_ENDPOINT)state.shop.aiEndpoint=window.STOCKROOM_AI_ENDPOINT;
let filters={q:'',cat:'',stock:''},searchTimer,autoFile=null,fileStatus='Saved in this browser',writeQueue=Promise.resolve();
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(state.shop.currency||'₹')+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const save=()=>{localStorage.setItem(KEY,JSON.stringify(state));if(autoFile)writeAutoFile()};const prod=id=>state.products.find(p=>p.id===id);const fmtDate=s=>s?new Date(s+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'—';
const localDate=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const today=()=>localDate(new Date());const daysTo=s=>s?Math.ceil((new Date(s+'T00:00:00')-new Date(today()+'T00:00:00'))/86400000):99999;
function status(p){if(p.qty<=0)return['Out of stock','out'];if(p.qty<=p.min)return['Low stock','low'];return['In stock','']}
function alerts(){return state.products.filter(p=>p.qty<=p.min||daysTo(p.expiry)<=45&&daysTo(p.expiry)>=0)}
function persist(msg){save();render();if(msg)toast(msg)}function toast(msg,error=false){const root=$('#toast-root');root.innerHTML=`<div class="toast ${error?'error':''}">${esc(msg)}</div>`;setTimeout(()=>root.innerHTML='',2800)}
function record(type,detail){state.activity.unshift({id:Date.now(),type,detail,at:new Date().toISOString()});state.activity=state.activity.slice(0,100)}
function nav(){return [['dashboard','⌂','Overview'],['products','▦','Products'],['billing','▤','Billing'],['activity','◷','Activity'],['settings','⚙','Settings']]}
function shell(content){let n=alerts().length;return `<aside class="sidebar"><div class="brand"><div class="brand-icon">✳</div><div><div class="brand-name">stockroom</div><div class="brand-caption">A calmer way to keep count</div></div></div><button class="shop-switch" data-view="settings"><span><strong>${esc(state.shop.name)}</strong><small>Store workspace</small></span><span>⌄</span></button><div class="nav-label">Workspace</div><nav class="nav">${nav().map(([id,ic,label])=>`<button class="${state.view===id?'active':''}" data-view="${id}"><span class="ico">${ic}</span><span>${label}</span>${id==='products'&&n?`<span class="count">${n}</span>`:''}</button>`).join('')}</nav><div class="side-bottom"><div class="tip"><b>Small shop, clear head.</b><p>Your stock stays on this device. Export a backup any time from Settings.</p></div><div class="profile"><div class="avatar">S</div><div><b>Store manager</b><small>Local workspace</small></div></div></div></aside><main class="main"><div class="topbar"><div class="crumb">Workspace <span> / </span> <b>${nav().find(x=>x[0]===state.view)?.[2]||'Overview'}</b></div><div class="top-actions"><button class="icon-btn" id="alertButton" title="View stock alerts">♧${n?'<span class="dot"></span>':''}</button><button class="btn primary" data-action="add">＋ <span class="mobile-head">Add item</span></button></div></div>${content}</main>`}
function metric(label,value,detail,icon){return `<div class="metric"><div class="metric-top"><span>${label}</span><span class="metric-icon">${icon}</span></div><strong>${value}</strong><small>${detail}</small></div>`}
function productRow(p){let [s,c]=status(p);return `<tr><td><div class="product-cell"><div class="product-thumb">${p.icon||'📦'}</div><div>${esc(p.name)}<small>${esc(p.sku)} · ${esc(p.category)}</small></div></div></td><td>${esc(p.barcode||'—')}</td><td><span class="location"><b>${esc(p.section)}</b><br>Row ${esc(p.row||'—')} · Col ${esc(p.column||'—')} · ${esc(p.rack||'—')}</span></td><td><b>${p.qty}</b> <span style="color:#9aa39d">${esc(p.unit)}</span></td><td>${money(p.price)}</td><td><span class="badge ${c}">${s}</span></td><td>${fmtDate(p.expiry)}</td><td><div class="table-actions"><button class="text-btn" data-edit="${p.id}">Edit</button><button class="text-btn" data-stock="${p.id}">± Stock</button></div></td></tr>`}
function productTable(list,tools=true){return `<div class="card">${tools?`<div class="table-tools"><div class="searchbox">⌕ <input id="productSearch" placeholder="Search name, SKU or barcode…" value="${esc(filters.q)}"><span style="font-size:10px">/</span></div><div class="toolbar"><select id="categoryFilter"><option value="">All categories</option>${state.shop.categories.map(c=>`<option ${filters.cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select><select id="stockFilter"><option value="" ${!filters.stock?'selected':''}>Any stock</option><option value="low" ${filters.stock==='low'?'selected':''}>Low stock</option><option value="out" ${filters.stock==='out'?'selected':''}>Out of stock</option></select><button class="btn small" data-action="scan">▦ Scan</button><button class="btn small" data-action="csv">↓ CSV</button></div></div>`:''}<div class="table-wrap"><table class="table"><thead><tr><th>Product</th><th>Barcode</th><th>Bin location</th><th>On hand</th><th>Price</th><th>Status</th><th>Expiry</th><th></th></tr></thead><tbody>${list.length?list.map(productRow).join(''):`<tr><td colspan="8"><div class="empty">No products match. Try another search or add an item.</div></td></tr>`}</tbody></table></div></div>`}
function dashboard(){const total=state.products.reduce((a,p)=>a+p.qty,0),worth=state.products.reduce((a,p)=>a+p.qty*p.cost,0),sold=state.sales.filter(s=>s.date.slice(0,10)===today()).reduce((a,s)=>a+s.total,0),low=state.products.filter(p=>p.qty<=p.min).length;const recent=[...state.products].sort((a,b)=>a.qty-b.qty).slice(0,5);let week=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);return d.toISOString().slice(0,10)});let max=1;let values=week.map(d=>state.sales.filter(s=>s.date.slice(0,10)===d).reduce((a,s)=>a+s.total,0));max=Math.max(...values,1);let alertList=alerts().slice(0,4);return `<div class="page-title"><div><div class="eyebrow">Today · ${new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'})}</div><h1>Good to see you.</h1><p>Here's the little picture of how your store is doing today.</p></div><button class="btn" data-action="stock">＋ Receive stock</button></div><div class="metrics">${metric('Items on hand',total.toLocaleString('en-IN'),`${state.products.length} products across ${state.shop.sections.length} sections`,'▦')}${metric('Stock value',money(worth),'At your recorded cost price','◈')}${metric('Sales today',money(sold),`<em>${state.sales.filter(s=>s.date.slice(0,10)===today()).length} bills</em> · a good day to be open`,'↗')}${metric('Needs a look',low,low?'<em>Low or out of stock</em>':'Everything is above minimum','⚑')}</div><div class="dash-grid"><section class="card chart-card"><div class="card-head"><div><h2>Sales at a glance</h2><p>A quiet little view of the last seven days</p></div><div class="chart-legend"><span><i class="legend-dot"></i>Sales</span></div></div><div class="card-body"><div class="bars">${values.map((v,i)=>`<div class="bar-group"><div class="bar primary-bar" style="height:${Math.max(v/max*88,v?5:2)}%" title="${money(v)}"></div></div>`).join('')}</div><div class="bar-labels">${week.map(d=>`<span>${new Date(d+'T00:00:00').toLocaleDateString('en-IN',{weekday:'short'})}</span> iv></div><div class="card section-card"><div class="card-head"><div><h2>Recent bills</h2><p>Latest checkouts</p></div></div><div class="card-body"><div class="alert-list">${state.sales.slice(0,5).map(s=>`<div class="alert-row"><div class="alert-symbol">▤</div><div class="alert-copy"><b>Bill ${esc(s.id.slice(-6))}</b><small>${new Date(s.date).toLocaleString('en-IN',{dateStyle:'short',timeStyle:'short'})} · ${s.items.length} items</small></div><b>${money(s.total)}</b></div>`).join('')||'<div class="empty">Your first bill will appear here.</div>'}</div></div></div></section></div>`}

ass="btn primary" data-action="autofile">Choose autosave file</button>${autoFile||fileStatus.includes('reconnect')?'<button class="btn" data-action="disconnectfile">Disconnect file</button>':''}</div><p style="margin-top:12px">Automatic file updates work in Chrome and Edge after you choose a file. Other browsers keep changes in browser storage.</p></section><section class="card settings-card"><h3>Hosted AI connection</h3><p>Connect your Cloudflare Worker to enable generated product setup and AI-ranked search. Requests send the search phrase and product name, category, and unit labels. Prices, quantities, barcodes, and expiry dates stay in your browser.</p><div class="field"><label>CLOUDFLARE WORKER URL</label><input id="aiEndpoint" type="url" value="${esc(state.shop.aiEndpoint||'')}" placeholder="https://stockroom-ai.your-name.workers.dev"></div><div class="quick-actions" style="margin-top:10px"><button class="btn primary" data-action="saveaiendpoint">Save connection</button><button class="btn" data-action="testai">Test connection</button></div><p id="aiStatus" style="margin-top:9px">${state.shop.aiEndpoint?'Worker URL configured.':'Not connected. Deploy the Worker and set ai-config.js or paste its URL here.'}</p></section><section class="card settings-card"><h3>Excel & CSV sheets</h3><p>CSV files open in Excel, Numbers, and Google Sheets. Download each sheet or bring an inventory CSV back in.</p><div class="quick-actions"><button class="btn small" data-action="csv">↓ Inventory sheet</button><button class="btn small" data-action="salescsv">↓ Sales sheet</button><button class="btn small" data-action="activitycsv">↓ Activity sheet</button><button class="btn small" data-action="importcsv">↑ Import inventory CSV</button><input id="csvImportFile" type="file" accept=".csv,text/csv" class="hidden"></div></section><section class="card settings-card"><h3>Backup & device</h3><p>JSON backup includes products, bills, settings, search trends and activity. Keep a copy before changing devices or clearing browser data.</p><div class="quick-actions"><button class="btn primary" data-action="backup">↓ Download full backup</button><button class="btn" data-action="import">↑ Restore backup</button><input id="importFile" type="file" accept="application/json" class="hidden"></div><p style="margin-top:12px;font-size:10px">This static GitHub Pages app does not sync to a cloud account. Use the local autosave file and keep a separate backup for another device.</p></section></div>`}

function starterModal(){let existing=state.products.map(p=>p.name.toLowerCase());modal('Start with a familiar item','Pick a starter, then add the price, count, barcode and shelf details that match your shop.',`<div class="alert-list">${starterCatalog.map(([key,name,category,unit,icon])=>{let added=existing.includes(name.toLowerCase());return `<div class="alert-row"><div class="alert-symbol">${icon}</div><div class="alert-copy"><b>${esc(name)}</b><small>${esc(category)} · sold by ${esc(unit)}</small></div><button class="btn small ${added?'':'soft'}" data-template="${key}" ${added?'disabled':''}>${added?'In catalog':'Set up'}</button></div>`}).join('')}</div><div class="form-actions"><button class="btn" data-close>Done</button></div>`);$('#modal-root').querySelectorAll('[data-template]').forEach(b=>b.onclick=()=>{let t=starterCatalog.find(x=>x[0]===b.dataset.template);if(!t)return;let[key,name,category,unit,icon]=t;closeModal();productForm({name,category,unit,icon,qty:0,min:state.shop.threshold,section:state.shop.sections[0]||'Main',sku:'',barcode:'',price:0,cost:0,dosage:'',expiry:'',row:'',column:'',rack:''})})}

function action(name){if(name==='add')productForm();else if(name==='stock')stockForm();else if(name==='scan')scanner();else if(name==='starters')starterModal();else if(name==='csv')exportCSV();else if(name==='salescsv')exportSalesCSV();else if(name==='activitycsv')exportActivityCSV();else if(name==='checkout')checkoutModal();else if(name==='savesettings'){state.shop.name=$('#shopName').value.trim()||'My shop';state.shop.currency=$('#currency').value||'₹';state.shop.threshold=Number($('#threshold').value)||0;persist('Shop details saved')}else if(name==='addsection'||name==='addcategory'){let label=name==='addsection'?'section':'category',v=prompt(`Name your new ${label}`);if(v?.trim()){let arr=name==='addsection'?state.shop.sections:state.shop.categories;if(!arr.some(x=>x.toLowerCase()===v.trim().toLowerCase()))arr.push(v.trim());persist(`${label[0].toUpperCase()+label.slice(1)} added`)}}else if(name==='backup')download('stockroom-backup-'+today()+'.json',JSON.stringify(state,null,2),'application/json');else if(name==='import')$('#importFile').click();else if(name==='autofile')chooseAutoFile();else if(name==='disconnectfile')disconnectAutoFile();else if(name==='importcsv')$('#csvImportFile').click()}
function cleanKey(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ')}
function makeSKU(name,category){let prefix=({Pantry:'PAN',Wellness:'WEL','Personal care':'CARE',Household:'HOME'})[category]||'ITEM',max=0;for(const p of state.products){let m=String(p.sku||'').match(new RegExp('^'+prefix+'-(\\d+)$','i'));if(m)max=Math.max(max,Number(m[1]))}let n=max+1,sku;do{sku=`${prefix}-${String(n++).padStart(4,'0')}`}while(state.products.some(p=>p.sku?.toLowerCase()===sku.toLowerCase()));return sku}
function productConflicts(candidate,id){let same=state.products.filter(p=>p.id!==id);let errors=[];const hit=(field,value,display)=>{if(!value)return;let found=same.find(p=>cleanKey(p[field])===cleanKey(value));if(found)errors.push(`${display} is already used by “${found.name}”`) };hit('name',candidate.name,'Product name');hit('sku',candidate.sku,'SKU');hit('barcode',candidate.barcode,'Barcode');if(candidate.section&&candidate.row&&candidate.column&&candidate.rack){let loc=[candidate.section,candidate.row,candidate.column,candidate.rack].map(cleanKey).join('|'),found=same.find(p=>p.section&&p.row&&p.column&&p.rack&&[p.section,p.row,p.column,p.rack].map(cleanKey).join('|')===loc);if(found)errors.push(`This shelf position is already assigned to “${found.name}”`)}return errors}
function productForm(p={}){const editing=!!p.id,cats=[...new Set([...state.shop.categories,...(p.category?[p.category]:[])])],secs=[...new Set([...state.shop.sections,...(p.section?[p.section]:[])])];let skuTouched=editing;modal(editing?'Edit product':'Add a product','Start typing a product name to see matching items and fill in common details.',`<form id="productForm"><input type="hidden" name="id" value="${esc(p.id||'')}"><div class="form-grid"><div class="field full"><label>PRODUCT NAME</label><input required autocomplete="off" id="productName" name="name" value="${esc(p.name||'')}" placeholder="Start typing, e.g. rice, milk, paracetamol"><div id="productSuggestions" style="display:none;border:1px solid var(--line);border-radius:10px;background:#fff;max-height:200px;overflow:auto;padding:5px;box-shadow:var(--shadow)"></div></div><div class="field"><label>CATEGORY</label><input required name="category" id="productCategory" list="categoryOptions" value="${esc(p.category||'')}" placeholder="Search or choose"><datalist id="categoryOptions">${cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div><div class="field"><label>QUANTITY ON HAND</label><input required type="number" min="0" step="1" name="qty" value="${Number(p.qty||0)}"></div><div class="field"><label>SELLING PRICE (${esc(state.shop.currency)})</label><input required type="number" min="0" step="0.01" name="price" value="${p.price?Number(p.price):''}" placeholder="Enter your price"></div><div class="field"><label>BARCODE <span style="font-weight:400;color:#9aa39d">· optional</span></label><input name="barcode" id="barcodeInput" value="${esc(p.barcode||'')}" placeholder="Scan or type a barcode"></div></div><div id="productValidation" class="notice" style="margin:12px 0 0;padding:9px 12px;background:#f6f8f5;border-color:#e9ece7;color:#6d7a71;font-size:11px">Name, SKU, barcode, and a fully specified shelf position will be checked for duplicates.</div><details ${editing?'open':''} style="margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:11px 12px"><summary style="cursor:pointer;font-weight:700;font-size:11px;color:var(--green)">More details · SKU, expiry & shelf position</summary><div class="form-grid" style="margin-top:13px"><div class="field"><label>SKU / ITEM CODE</label><input name="sku" id="productSku" value="${esc(p.sku||makeSKU(p.name||'',p.category||''))}" placeholder="Auto-generated"></div><div class="field"><label>UNIT</label><input name="unit" value="${esc(p.unit||'piece')}" placeholder="piece, bottle, box…"></div><div class="field"><label>SECTION / ZONE</label><input required name="section" list="sectionOptions" value="${esc(p.section||state.shop.sections[0]||'')}" placeholder="Choose a section"><datalist id="sectionOptions">${secs.map(s=>`<option value="${esc(s)}">`).join('')}</datalist></div><div class="field"><label>MINIMUM STOCK</label><input type="number" min="0" name="min" value="${Number(p.min??state.shop.threshold)}"></div><div class="field"><label>ROW</label><input name="row" value="${esc(p.row||'')}" placeholder="A"></div><div class="field"><label>COLUMN</label><input name="column" value="${esc(p.column||'')}" placeholder="02"></div><div class="field"><label>RACK ID</label><input name="rack" value="${esc(p.rack||'')}" placeholder="R-01"></div><div class="field"><label>UNIT COST</label><input type="number" min="0" step="0.01" name="cost" value="${p.cost?Number(p.cost):''}" placeholder="Optional"></div><div class="field"><label>DOSAGE / VARIANT</label><input name="dosage" id="productDosage" value="${esc(p.dosage||'')}" placeholder="e.g. 500 mg, size M"></div><div class="field"><label>BEST BEFORE / EXPIRY</label><input type="date" name="expiry" value="${esc(p.expiry||'')}"></div><div class="field"><label>ICON</label><input name="icon" id="productIcon" value="${esc(p.icon||'📦')}" maxlength="8"></div></div></details><div class="form-actions"><button type="button" class="btn" data-close>Cancel</button><button id="saveProduct" class="btn primary">${editing?'Save changes':'Add product'}</button></div></form>`,'wide');
const form=$('#productForm'),nameInput=$('#productName'),categoryInput=$('#productCategory'),skuInput=$('#productSku'),suggestions=$('#productSuggestions');
function check(){let f=Object.fromEntries(new FormData(form)),candidate={...p,...f};candidate.id=p.id||'';let errors=productConflicts(candidate,p.id);let box=$('#productValidation'),btn=$('#saveProduct');if(errors.length){box.style.background='#fff0ed';box.style.borderColor='#f0d1cb';box.style.color='#ad4943';box.innerHTML='⚠ '+errors.map(esc).join('<br>')}else{box.style.background='#edf6ef';box.style.borderColor='#d8e9dc';box.style.color='#477553';box.textContent='✓ No duplicate product details or shelf position found'}btn.disabled=errors.length>0;btn.style.opacity=errors.length>0?'.55':'1';btn.style.cursor=errors.length>0?'not-allowed':'pointer';return errors}
function fillFromTemplate(t){nameInput.value=t[1];categoryInput.value=t[2];form.elements.unit.value=t[3];$('#productIcon').value=t[4];form.elements.min.value=state.shop.threshold;let dosage=(t[1].match(/\b\d+\s?(?:mg|mcg|ml|iu|g)\b/i)||[])[0]||'';$('#productDosage').value=dosage;if(!skuTouched)skuInput.value=makeSKU(t[1],t[2]);if(/milk|water/i.test(t[1])&&state.shop.sections.some(s=>/cold|chill|fridge/i.test(s)))form.elements.section.value=state.shop.sections.find(s=>/cold|chill|fridge/i.test(s));check()}
function showSuggestions(){let q=cleanKey(nameInput.value),cat=cleanKey(categoryInput.value);let templates=starterCatalog.filter(t=>(!q||cleanKey(t[1]).includes(q)||cleanKey(t[2]).includes(q))&&(!cat||cleanKey(t[2])===cat)).slice(0,5);let existing=state.products.filter(x=>(!q||cleanKey(x.name).includes(q)||cleanKey(x.sku).includes(q)||cleanKey(x.barcode).includes(q))&&(!cat||cleanKey(x.category)===cat)).slice(0,3);let rows=[...templates.map(t=>`<button type="button" data-pick="${esc(t[0])}" style="display:flex;width:100%;border:0;background:white;text-align:left;padding:9px;border-radius:7px;gap:9px;align-items:center;color:var(--ink)"><span>${t[4]}</span><span><b style="font-size:11px">${esc(t[1])}</b><small style="display:block;color:var(--sub);font-size:10px">${esc(t[2])} · ${esc(t[3])} · suggested setup</small></span></button>`),...existing.map(x=>`<button type="button" data-existing="${esc(x.id)}" style="display:flex;width:100%;border:0;background:#fff8f2;text-align:left;padding:8px;border-radius:7px;gap:9px;align-items:center;color:#98643d"><span>↗</span><span><b style="font-size:11px">${esc(x.name)}</b><small style="display:block;font-size:10px">Already in inventory · select to edit</small></span></button>`)].join('');suggestions.innerHTML=rows||`<div style="padding:9px;color:var(--sub);font-size:11px">No mapped match. You can keep entering a custom product.</div>`;suggestions.style.display='block';suggestions.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{let t=starterCatalog.find(x=>x[0]===b.dataset.pick);if(t)fillFromTemplate(t);suggestions.style.display='none'});suggestions.querySelectorAll('[data-existing]').forEach(b=>b.onclick=()=>{let found=prod(b.dataset.existing);closeModal();if(found)productForm(found)})}
nameInput.onfocus=showSuggestions;nameInput.oninput=()=>{let exact=starterCatalog.find(t=>cleanKey(t[1])===cleanKey(nameInput.value));if(exact)fillFromTemplate(exact);else if(!skuTouched)skuInput.value=makeSKU(nameInput.value,categoryInput.value);showSuggestions();check()};categoryInput.oninput=()=>{if(!skuTouched)skuInput.value=makeSKU(nameInput.value,categoryInput.value);showSuggestions();check()};skuInput.oninput=()=>{skuTouched=true;check()};form.oninput=e=>{if(!['productName','productCategory','productSku'].includes(e.target.id))check()};form.onchange=check;form.onsubmit=e=>{e.preventDefault();let errs=check();if(errs.length)return;let f=Object.fromEntries(new FormData(form)),item={...p,...f,id:p.id||'p'+Date.now()};['qty','min','price','cost'].forEach(k=>item[k]=Number(item[k]||0));item.name=item.name.trim();item.sku=item.sku.trim();item.barcode=item.barcode.trim();item.category=item.category.trim();item.section=item.section.trim()||state.shop.sections[0]||'Main';item.unit=item.unit.trim()||'piece';item.icon=item.icon||'📦';if(!state.shop.categories.includes(item.category))state.shop.categories.push(item.category);if(!state.shop.sections.includes(item.section))state.shop.sections.push(item.section);if(editing){state.products=state.products.map(x=>x.id===p.id?item:x);record('product',`Updated ${item.name}`)}else{state.products.unshift(item);record('product',`Added ${item.name} (${item.qty} ${item.unit})`)}closeModal();persist(editing?'Product updated':'Product added to your shelves')};check();}
function modal(title,sub,body,wide=false){$('#modal-root').innerHTML=`<div class="overlay" id="overlay"><div class="modal ${wide?'wide':''}"><div class="modal-head"><div><h2>${title}</h2><p>${sub}</p></div><button class="close" data-close>×</button></div>${body}</div></div>`;$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()})}
function closeModal(){if(window._stockStream){window._stockStream.getTracks().forEach(t=>t.stop());window._stockStream=null}$('#modal-root').innerHTML=''}
function productForm(p={}){const editing=!!p.id,cats=[...new Set([...state.shop.categories,...(p.category?[p.category]:[])])],secs=[...new Set([...state.shop.sections,...(p.section?[p.section]:[])])];modal(editing?'A few product details':'Add something to the shelves',editing?'Make a quick change and we’ll keep the record tidy.':'Give your new item a home and a price.',`<form id="productForm"><div class="form-grid"><input type="hidden" name="id" value="${esc(p.id||'')}"><div class="field full"><label>PRODUCT NAME *</label><input required name="name" value="${esc(p.name||'')}" placeholder="e.g. Wildflower honey"></div><div class="field"><label>SKU / ITEM CODE</label><input name="sku" value="${esc(p.sku||'')}" placeholder="PAN-1001"></div><div class="field"><label>BARCODE</label><input name="barcode" id="barcodeInput" value="${esc(p.barcode||'')}" placeholder="Scan or type a code"></div><div class="field"><label>CATEGORY</label><select name="category"><option value="">Choose category</option>${cats.map(c=>`<option ${p.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div class="field"><label>UNIT</label><input name="unit" value="${esc(p.unit||'piece')}" placeholder="piece, box, bottle…"></div><div class="field"><label>ON HAND</label><input type="number" name="qty" min="0" value="${Number(p.qty||0)}"></div><div class="field"><label>LOW STOCK AT</label><input type="number" name="min" min="0" value="${Number(p.min??state.shop.threshold)}"></div><div class="field"><label>SELLING PRICE</label><input type="number" step="0.01" min="0" name="price" value="${Number(p.price||0)}"></div><div class="field"><label>UNIT COST</label><input type="number" step="0.01" min="0" name="cost" value="${Number(p.cost||0)}"></div><div class="field"><label>DOSAGE / VARIANT</label><input name="dosage" value="${esc(p.dosage||'')}" placeholder="e.g. 500 mg, size M"></div><div class="field"><label>BEST BEFORE / EXPIRY</label><input type="date" name="expiry" value="${esc(p.expiry||'')}"></div><div class="field full"><label>SECTION / ZONE</label><select name="section"><option value="">Choose section</option>${secs.map(c=>`<option ${p.section===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div class="field"><label>ROW</label><input name="row" value="${esc(p.row||'')}" placeholder="A"></div><div class="field"><label>COLUMN</label><input name="column" value="${esc(p.column||'')}" placeholder="02"></div><div class="field"><label>RACK ID</label><input name="rack" value="${esc(p.rack||'')}" placeholder="R-01"></div><div class="field"><label>ICON (EMOJI)</label><input name="icon" value="${esc(p.icon||'📦')}" maxlength="8"></div></div><div class="form-actions"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary">${editing?'Save changes':'Add product'}</button></div></form>`,'wide');$('#productForm').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.currentTarget));let item={...p,...f,id:p.id||'p'+Date.now()};['qty','min','price','cost'].forEach(k=>item[k]=Number(item[k]||0));item.name=item.name.trim();if(!item.sku)item.sku='ITEM-'+String(Date.now()).slice(-6);if(!item.category)item.category='Uncategorized';if(!item.section)item.section=state.shop.sections[0]||'Main';if(!state.shop.categories.includes(item.category))state.shop.categories.push(item.category);if(!state.shop.sections.includes(item.section))state.shop.sections.push(item.section);if(editing){state.products=state.products.map(x=>x.id===p.id?item:x);record('product',`Updated ${item.name}`)}else{state.products.unshift(item);record('product',`Added ${item.name} (${item.qty} ${item.unit})`)}closeModal();persist(editing?'Product updated':'Product added to your shelves')};}
function stockForm(pre=''){modal('Move a little stock','Receive a delivery or note a manual adjustment.',`<form id="stockForm"><div class="form-grid"><div class="field full"><label>PRODUCT</label><select name="id" required>${state.products.map(p=>`<option value="${p.id}" ${p.id===pre?'selected':''}>${esc(p.name)} · ${p.qty} ${esc(p.unit)} on hand</option>`).join('')}</select></div><div class="field"><label>CHANGE IN QUANTITY</label><input required type="number" name="qty" value="1" placeholder="Use a minus sign to remove"></div><div class="field"><label>NOTE (OPTIONAL)</label><input name="note" placeholder="Delivery, damaged, count correction…"></div></div><p style="font-size:10px;color:var(--sub);margin:11px 0 0">Add a positive number to receive stock, or a negative number for items removed.</p><div class="form-actions"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary">Save stock change</button></div></form>`);$('#stockForm').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.currentTarget)),p=prod(f.id),q=Number(f.qty);if(!p)return;if(p.qty+q<0)return toast('That change would put stock below zero.',true);p.qty+=q;record('stock',`${q>0?'Received':'Adjusted'} ${Math.abs(q)} ${p.unit} · ${p.name}${f.note?' · '+f.note:''}`);closeModal();persist('Stock count updated')};}
function scanner(){modal('Scan a barcode','Use your camera when supported, or type a barcode below.',`<div class="field"><label>BARCODE / SKU</label><div class="toolbar"><input id="scanText" style="flex:1;min-width:0;padding:11px;border:1px solid var(--line);border-radius:9px" placeholder="Point your scanner here, or type a code"><button class="btn primary" id="scanLookup">Find item</button></div></div><div id="cameraArea" style="margin-top:13px"></div><div class="form-actions"><button class="btn" id="cameraStart">◎ Use camera</button><button class="btn" data-close>Done</button></div>`);const lookup=()=>{let code=$('#scanText').value.trim();if(!code)return;let p=state.products.find(p=>p.barcode===code||p.sku.toLowerCase()===code.toLowerCase());if(p){closeModal();if(state.view==='billing'){addCart(p.id);render()}else{state.view='products';render();toast(`Found ${p.name} · ${p.section}, row ${p.row}, column ${p.column}, rack ${p.rack}`)}}else{toast('No match yet. Add this item to start tracking it.',true);let area=$('#cameraArea');area.innerHTML='<button class="btn soft" id="addScanned">＋ Add a product with this barcode</button>';$('#addScanned').onclick=()=>{let barcode=$('#scanText').value.trim();closeModal();productForm({barcode})};$('#scanText').focus()}};$('#scanLookup').onclick=lookup;$('#scanText').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();lookup()}};$('#cameraStart').onclick=async()=>{if(!('BarcodeDetector'in window)||!navigator.mediaDevices?.getUserMedia){$('#cameraArea').innerHTML='<div class="notice">Camera scanning is not supported in this browser. A USB barcode scanner or typed barcode works in the field above.</div>';return}try{let stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});window._stockStream=stream;$('#cameraArea').innerHTML='<video id="scanVideo" autoplay playsinline style="width:100%;max-height:260px;border-radius:12px;background:#17231d"></video>';let v=$('#scanVideo');v.srcObject=stream;let detector=new BarcodeDetector();let tick=async()=>{if(!window._stockStream)return;try{let codes=await detector.detect(v);if(codes.length){$('#scanText').value=codes[0].rawValue;lookup();return}}catch{}requestAnimationFrame(tick)};v.onloadedmetadata=()=>{v.play();tick()}}catch{$('#cameraArea').innerHTML='<div class="notice">Could not open the camera. Check browser camera permission, or type the barcode instead.</div>'}}}
function addCart(id,qty=1){let p=prod(id);if(!p)return;let l=state.cart.find(x=>x.id===id);if(l)l.qty=Math.min(p.qty,l.qty+qty);else state.cart.push({id,qty:Math.min(p.qty,qty)});state.cart=state.cart.filter(x=>x.qty>0);save()}
function trackSearch(q){q=q.trim();if(q.length<2)return;let found=state.searches.find(s=>s.query.toLowerCase()===q.toLowerCase());if(found)found.count++;else state.searches.unshift({query:q,count:1});state.searches.sort((a,b)=>b.count-a.count);state.searches=state.searches.slice(0,30);save()}
function download(name,content,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function openFileDB(){return new Promise((resolve,reject)=>{let req=indexedDB.open('stockroom-local-files',1);req.onupgradeneeded=()=>req.result.createObjectStore('settings');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function updateFileStatus(){let el=$('#autosaveStatus');if(el)el.textContent=fileStatus}
async function loadAutoFile(){if(!('showSaveFilePicker'in window)||!('indexedDB'in window))return;try{let db=await openFileDB(),handle=await new Promise((resolve,reject)=>{let r=db.transaction('settings').objectStore('settings').get('backup');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});db.close();if(!handle)return;let permission=await handle.queryPermission({mode:'readwrite'});if(permission==='granted'){autoFile=handle;fileStatus=`Auto-saving to ${handle.name}`;writeAutoFile()}else fileStatus='Local file saved · reconnect to resume auto-save';updateFileStatus()}catch{}}
async function chooseAutoFile(){if(!('showSaveFilePicker'in window)){toast('Automatic file saving works in Chrome or Edge. Browser storage is still saving your changes.',true);return}try{let handle=await window.showSaveFilePicker({suggestedName:'stockroom-autosave.json',types:[{description:'Stockroom backup',accept:{'application/json':['.json']}}]});let db=await openFileDB();await new Promise((resolve,reject)=>{let tx=db.transaction('settings','readwrite');tx.objectStore('settings').put(handle,'backup');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close();autoFile=handle;fileStatus=`Auto-saving to ${handle.name}`;await writeAutoFile();updateFileStatus();toast('Local autosave is connected')}catch(e){if(e.name!=='AbortError')toast('Could not connect that file. Browser storage is still saving your changes.',true)}}
function writeAutoFile(){if(!autoFile)return;let snapshot=JSON.stringify(state,null,2),handle=autoFile;writeQueue=writeQueue.then(async()=>{let permission=await handle.queryPermission({mode:'readwrite'});if(permission!=='granted')permission=await handle.requestPermission({mode:'readwrite'});if(permission!=='granted'){autoFile=null;fileStatus='Local file needs reconnection · browser copy is saved';updateFileStatus();return}let stream=await handle.createWritable();await stream.write(snapshot);await stream.close();fileStatus=`Auto-saving to ${handle.name}`;updateFileStatus()}).catch(()=>{autoFile=null;fileStatus='Local file could not be reached · browser copy is saved';updateFileStatus()});return writeQueue}
async function disconnectAutoFile(){autoFile=null;fileStatus='Saved in this browser';try{let db=await openFileDB();await new Promise(resolve=>{let tx=db.transaction('settings','readwrite');tx.objectStore('settings').delete('backup');tx.oncomplete=resolve;tx.onerror=resolve});db.close()}catch{}updateFileStatus();toast('Local file autosave disconnected')}
function exportCSV(){let head=['name','sku','barcode','category','section','row','column','rack','quantity','unit','minimum','price','cost','dosage','expiry'];let quote=x=>'"'+String(x??'').replace(/"/g,'""')+'"';download('stockroom-inventory.csv',[head.join(','),...state.products.map(p=>head.map(k=>quote(({quantity:p.qty,minimum:p.min}[k]??p[k]))).join(','))].join('\r\n'),'text/csv;charset=utf-8')}
function exportSalesCSV(){let head=['bill_id','date','customer','payment_method','product_sku','product','quantity','unit_price','line_total'];let quote=x=>'"'+String(x??'').replace(/"/g,'""')+'"';let rows=state.sales.flatMap(s=>s.items.map(i=>[s.id,s.date,s.customer,s.method,prod(i.id)?.sku||'',i.name,i.qty,i.price,i.qty*i.price]));download('stockroom-sales.csv',[head.join(','),...rows.map(r=>r.map(quote).join(','))].join('\r\n'),'text/csv;charset=utf-8')}

function parseCSV(text){let rows=[],row=[],cell='',quoted=false;text=text.replace(/^\uFEFF/,'');for(let i=0;i<text.length;i++){let c=text[i],n=text[i+1];if(quoted){if(c==='"'&&n==='"'){cell+='"';i++}else if(c==='"')quoted=false;else cell+=c}else if(c==='"')quoted=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell=''}else if(c!=='\r')cell+=c}row.push(cell);if(row.some(x=>x!==''))rows.push(row);return rows}

function showMatches(){let q=cleanKey(nameInput.value),cat=cleanKey(catInput.value);if(!q&&!cat){suggestions.style.display='none';return}let templates=starterCatalog.filter(t=>(!q||cleanKey(t[1]).includes(q)||cleanKey(t[2]).includes(q))&&(!cat||cleanKey(t[2])===cat)).slice(0,5),matches=state.products.filter(x=>(!q||cleanKey(x.name).includes(q)||cleanKey(x.sku).includes(q)||cleanKey(x.barcode).includes(q))&&(!cat||cleanKey(x.category)===cat)).slice(0,3);suggestions.innerHTML=[...templates.map(t=>`<button type="button" data-pick="${esc(t[0])}" style="display:flex;width:100%;border:0;background:#fff;text-align:left;padding:9px;border-radius:7px;gap:9px;align-items:center;color:var(--ink)"><span>${t[4]}</span><span><b style="font-size:11px">${esc(t[1])}</b><small style="display:block;color:var(--sub);font-size:10px">${esc(t[2])} · package sizes filled in</small></span></button>`),...matches.map(x=>`<button type="button" data-existing="${esc(x.id)}" style="display:flex;width:100%;border:0;background:#fff8f2;text-align:left;padding:8px;border-radius:7px;gap:9px;align-items:center;color:#98643d"><span>↗</span><span><b style="font-size:11px">${esc(x.name)}</b><small style="display:block;font-size:10px">Already in inventory · edit this item</small></span></button>`)].join('')||'<div style="padding:9px;color:var(--sub);font-size:11px">No matches. Continue with your custom product.</div>';suggestions.style.display='block';suggestions.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{let t=starterCatalog.find(x=>x[0]===b.dataset.pick);if(t)fillSuggestion(t);suggestions.style.display='none'});suggestions.querySelectorAll('[data-existing]').forEach(b=>b.onclick=()=>{let found=prod(b.dataset.existing);closeModal();if(found)productForm(found)})}
$('#browseCommon').onclick=()=>starterModal();nameInput.oninput=()=>{let exact=starterCatalog.find(t=>cleanKey(t[1])===cleanKey(nameInput.value));if(exact)fillSuggestion(exact);else updateSku();showMatches();validate()};catInput.oninput=()=>{updateSku();showMatches();validate()};form.elements.unit.oninput=()=>{syncUnits();updateSku();validate()};for(const id of ['packUnit','packSize','outerUnit','outerCount'])form.elements[id].oninput=()=>{syncUnits();validate()};skuInput.oninput=()=>{existingSku=true;validate()};form.elements.min.oninput=()=>{minTouched=true};form.oninput=e=>{if(!['productName','productCategory','baseUnit','packUnit','packSize','outerUnit','outerCount','productSku'].includes(e.target.id))validate()};form.onchange=validate;syncUnits(qtyUnit);validate();form.onsubmit=e=>{e.preventDefault();if(validate().length)return;let f=Object.fromEntries(new FormData(form)),cfg={unit:f.unit||'piece',packUnit:f.packUnit||'',packSize:Number(f.packSize)||0,outerUnit:f.outerUnit||'',outerCount:Number(f.outerCount)||0},item={...data,...f,id:p.id||'p'+Date.now()};item.unit=cfg.unit;item.packUnit=cfg.packUnit;item.packSize=cfg.packSize;item.outerUnit=cfg.outerUnit;item.outerCount=cfg.outerCount;item.qty=Number(f.qty||0)*unitFactor(cfg,f.qtyUnit);item.min=Number(f.min||0);item.price=Number(f.price||0);item.priceUnit=cfg.packUnit||cfg.unit;item.cost=Number(f.cost||0);item.name=f.name.trim();item.sku=f.sku.trim()||makeSKU(f.name,f.category);item.barcode=f.barcode.trim();item.category=f.category.trim();item.section=f.section.trim()||state.shop.sections[0]||'Main';item.unit=f.unit.trim()||'piece';item.dosage=f.dosage.trim();item.expiry=f.expiry;item.row=f.row.trim();item.column=f.column.trim();item.rack=f.rack.trim();item.icon=f.icon||'📦';if(!cfg.packUnit)item.packSize=0;if(!cfg.outerUnit)item.outerCount=0;if(!state.shop.categories.includes(item.category))state.shop.categories.push(item.category);if(!state.shop.sections.includes(item.section))state.shop.sections.push(item.section);if(editing){state.products=state.products.map(x=>x.id===p.id?item:x);record('product',`Updated ${item.name}`)}else{state.products.unshift(item);record('product',`Added ${item.name} (${item.qty} ${item.unit})`)}closeModal();persist(editing?'Product updated':'Product added to your shelves')}}


async function callHostedAI(path,payload){let endpoint=String(state.shop.aiEndpoint||'').trim().replace(/\/+$/,'');if(!endpoint)throw Error('Connect the Cloudflare Worker in Settings first.');let controller=new AbortController(),timer=setTimeout(()=>controller.abort(),8000);try{let res=await fetch(endpoint+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal:controller.signal});let data=await res.json().catch(()=>({}));if(!res.ok)throw Error(data.error||data.detail||('Worker returned '+res.status));return data}catch(e){if(e.name==='AbortError')throw Error('The hosted AI took longer than 8 seconds.');if(e instanceof TypeError)throw Error('Could not reach the AI Worker. Check your internet connection and Worker URL.');throw e}finally{clearTimeout(timer)}}
async function testHostedAI(){let endpoint=String($('#aiEndpoint')?.value||state.shop.aiEndpoint||'').trim().replace(/\/+$/,'');let status=$('#aiStatus');if(!endpoint){if(status)status.textContent='Paste the deployed Worker URL first.';return toast('Add your Worker URL in Settings.',true)}try{if(status)status.textContent='Checking the Worker…';let r=await fetch(endpoint+'/health');let data=await r.json();if(!r.ok||!data.ok)throw Error(data.error||'Health check failed');if(!data.aiBound)throw Error('Worker is reachable, but its Workers AI binding named AI is missing.');if(status)status.textContent=`Connected · ${data.model}`;toast('Cloud AI is connected')}catch(e){if(status)status.textContent=`Could not connect: ${e.message}. Check the Worker URL, AI binding, and allowed origin.`;toast('Could not connect to the Worker.',true)}}
function aiSearchModal(){modal('AI product finder','Exact item names are matched instantly. Hosted AI helps with broader requests such as “something for fever”.', '<div class="field"><label>WHAT ARE YOU LOOKING FOR?</label><input id="aiQuery" placeholder="e.g. curd, meat, or something for fever"></div><div class="form-actions"><span id="aiState" style="font-size:10px;color:var(--sub);margin-right:auto">'+(state.shop.aiEndpoint?'Quick search ready · AI can find related terms.':'Quick local search ready · connect hosted AI for related terms.')+'</span><button class="btn primary" id="aiSearchGo">Find items</button></div><div id="aiResults" class="alert-list" style="margin-top:12px"></div>','wide');$('#aiQuery').onkeydown=e=>{if(e.key==='Enter')$('#aiSearchGo').click()};const normalize=value=>String(value||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim(),groups=[['curd','yogurt','yoghurt'],['meat','chicken','mutton','beef','pork','lamb'],['laundry','detergent','washing powder','clothes wash'],['fever','paracetamol'],['hand wash','handwash','soap']];function draw(items,byId){const area=$('#aiResults');area.innerHTML=items.length?items.map(item=>'<div class="alert-row"><div class="alert-symbol">'+(item.kind==='product'?esc(item.item.icon||'📦'):item.icon)+'</div><div class="alert-copy"><b>'+esc(item.name)+'</b><small>'+esc(item.kind==='product'?item.category+' · '+(item.item.section||'No section')+' · '+(item.item.rack||'No rack'):item.category+' · common item template')+'</small></div><button class="btn small '+(item.kind==='starter'?'soft':'')+'" data-ai-result="'+esc(item.id)+'">'+(item.kind==='starter'?'Set up':'Locate')+'</button></div>').join(''):'<div class="empty">No matching items in your inventory or common-item list yet.</div>';area.querySelectorAll('[data-ai-result]').forEach(b=>b.onclick=()=>{let item=byId.get(b.dataset.aiResult);if(item?.kind==='starter'){openStarter(item.starterKey);return}let p=item?.item;if(!p)return;closeModal();if(state.view==='billing'){render();$('#billSearch').value=p.name;renderBillResults(p.name)}else{state.view='products';filters.q=p.name;filters.cat='';filters.stock='';render();toast(p.name+' · '+(p.section||'no section')+', row '+(p.row||'—')+', column '+(p.column||'—')+', rack '+(p.rack||'—'))}})}$('#aiSearchGo').onclick=async()=>{let query=$('#aiQuery').value.trim();if(!query)return toast('Describe an item to search for.');let status=$('#aiState'),area=$('#aiResults'),button=$('#aiSearchGo'),needle=normalize(query),candidates=[...state.products.map(p=>({id:'p_'+p.id,kind:'product',name:p.name,category:p.category,unit:p.unit,item:p})),...starterCatalog.filter(t=>!state.products.some(p=>cleanKey(p.name)===cleanKey(t[1]))).map(t=>({id:'s_'+t[0],kind:'starter',name:t[1],category:t[2],unit:t[3],icon:t[4],starterKey:t[0]}))];function score(candidate){let name=normalize(candidate.name),category=normalize(candidate.category),combined=name+' '+category,score=0;if(name===needle)score=110;else if(name.includes(needle)||needle.includes(name))score=75;for(const word of needle.split(/\s+/).filter(x=>x.length>1)){if(name.includes(word))score+=18;if(category.includes(word))score+=8}for(const group of groups)if(group.some(word=>needle.includes(word))&&group.some(word=>combined.includes(word)))score=Math.max(score,44);return score}let local=candidates.map(item=>({item,score:score(item)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,8),localItems=local.map(x=>x.item),byId=new Map(candidates.map(x=>[x.id,x]));area.innerHTML='';button.disabled=true;button.textContent='Searching…';if(localItems.length)draw(localItems,byId);if(local.some(x=>x.score>=75)){status.textContent='Instant matches · searched this device and the common-item list.';button.disabled=false;button.textContent='Find items';return}status.textContent=localItems.length?'Quick matches shown · asking hosted AI to check related terms…':'Asking hosted AI · checking your items and common products…';try{let ordered=localItems.concat(candidates.filter(item=>!localItems.some(match=>match.id===item.id))),pool=ordered.slice(0,80),answer=await callHostedAI('/v1/search',{query,items:pool.map(({id,name,category,unit})=>({id,name,category,unit}))}),ranked=(answer.matches||[]).map(x=>byId.get(x.id)).filter(Boolean);if(ranked.length){draw(ranked,byId);status.textContent='Hosted AI matched related items · '+(answer.model||'Cloudflare Workers AI')}else if(localItems.length){status.textContent='AI found no additional match · showing quick local matches.'}else{status.textContent='No close match found.';area.innerHTML='<div class="empty">Try a product name or add it from Common items.</div>'}}catch(e){if(localItems.length){draw(localItems,byId);status.textContent='AI unavailable · showing quick local matches. '+e.message}else{status.textContent='AI search could not connect.';area.innerHTML='<div class="notice">'+esc(e.message)+'</div>'}}finally{button.disabled=false;button.textContent='Find items'}}}
async function aiAutofill(){let description=$('#productName')?.value.trim();if(!description)return toast('Enter a product name or short description first.');let matches=$('#productSuggestions'),status='Sending only that description and category names for a setup suggestion…';if(matches)matches.innerHTML=`<div class="notice">${esc(status)}</div>`;try{let data=await callHostedAI('/v1/autofill',{description,categories:state.shop.categories}),s=data.suggestion||{},form=$('#productForm');if(!form)return;const set=(name,value)=>{let el=form.elements[name];if(el&&value!==undefined&&value!==null){el.value=String(value);el.dispatchEvent(new Event('input',{bubbles:true}))}};document.querySelectorAll('#productForm details')[1]?.setAttribute('open','');if(s.name)set('name',s.name);if(s.category)set('category',s.category);if(s.unit)set('unit',s.unit);set('packUnit',s.packUnit);set('packSize',s.packUnit?s.packSize:'');set('outerUnit',s.outerUnit);set('outerCount',s.outerUnit?s.outerCount:'');if(s.packSize){set('min',state.shop.threshold*Number(s.packSize))}if(matches)matches.innerHTML=`<div class="notice">Hosted AI suggested ${esc(s.category||'a category')} and ${esc(s.unit||'a base unit')}${s.packUnit?` · 1 ${esc(s.packUnit)} = ${esc(s.packSize)} ${esc(s.unit)}`:''}${s.outerUnit?` · ${esc(s.outerUnit)} contains ${esc(s.outerCount)} packs`:''}. Review the suggestion; enter your own stock and price.</div>`;toast('AI setup suggestion added · review before saving')}catch(e){if(matches)matches.innerHTML=`<div class="notice">${esc(e.message)}</div>`;toast('Hosted AI setup request failed.',true)}}
function action(name){if(name==='add')productForm();else if(name==='starters')starterModal();else if(name==='stock')stockForm();else if(name==='scan')scanner();else if(name==='ai-search')aiSearchModal();else if(name==='csv')exportCSV();else if(name==='salescsv')exportSalesCSV();else if(name==='activitycsv')exportActivityCSV();else if(name==='checkout')checkoutModal();else if(name==='savesettings'){state.shop.name=$('#shopName').value.trim()||'My shop';state.shop.currency=$('#currency').value||'₹';state.shop.threshold=Number($('#threshold').value)||0;persist('Shop details saved')}else if(name==='saveaiendpoint'){let value=$('#aiEndpoint').value.trim().replace(/\/+$/,'');if(value&&!/^https:\/\//i.test(value)){toast('Use the HTTPS URL shown after deploying your Worker.',true);return}state.shop.aiEndpoint=value;persist(value?'Cloud AI connection saved':'Cloud AI disconnected')}else if(name==='testai')testHostedAI();else if(name==='addsection'||name==='addcategory'){let label=name==='addsection'?'section':'category',v=prompt(`Name your new ${label}`);if(v?.trim()){let arr=name==='addsection'?state.shop.sections:state.shop.categories;if(!arr.some(x=>cleanKey(x)===cleanKey(v)))arr.push(v.trim());persist(`${label[0].toUpperCase()+label.slice(1)} added`)}}else if(name==='backup')download('stockroom-backup-'+today()+'.json',JSON.stringify(state,null,2),'application/json');else if(name==='import')$('#importFile').click();else if(name==='autofile')chooseAutoFile();else if(name==='disconnectfile')disconnectAutoFile();else if(name==='importcsv')$('#csvImportFile').click()}
render();loadAutoFile();
